<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Login Admin — Dashboard SKM</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    body {
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-container {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .login-logo {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .login-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 8px;
    }
    .login-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      justify-content: center;
    }
    #login-error {
      display: none;
      color: var(--red);
      background: var(--red-pale);
      border: 1px solid var(--red-light);
      padding: 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      margin-bottom: 16px;
    }
    .back-link {
      display: block;
      margin-top: 24px;
      font-size: 12px;
      color: var(--navy);
      text-decoration: none;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-logo">🏛</div>
    <div class="login-title">Portal Admin SKM</div>
    <div class="login-sub">Perpustakaan Amir Machmud<br>Kementerian Dalam Negeri RI</div>

    <div id="login-error">Password salah. Silakan coba lagi.</div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="password">Token / Password Akses</label>
        <input type="password" id="password" class="form-control" placeholder="Masukkan password..." required autofocus style="width:100%; padding: 10px; margin-top: 8px;">
      </div>
      <button type="submit" class="btn btn-primary btn-login">Masuk ke Dashboard</button>
    </form>

    <a href="index.html" class="back-link">← Kembali ke Halaman Publik</a>
  </div>

  <script>
    // Konfigurasi Password (untuk keperluan magang, hardcode sederhana di sini)
    // Bisa diganti jadi apa saja, misalnya: "adminperpus2025"
    const VALID_PASSWORD = "admin"; 

    function handleLogin(e) {
      e.preventDefault();
      const input = document.getElementById("password").value;
      
      if (input === VALID_PASSWORD) {
        // Simpan sesi login di browser
        sessionStorage.setItem("skm_admin_logged_in", "true");
        // Redirect ke admin
        window.location.href = "admin.html";
      } else {
        document.getElementById("login-error").style.display = "block";
        document.getElementById("password").value = "";
      }
    }

    // Kalau sudah login, langsung lempar ke admin
    if (sessionStorage.getItem("skm_admin_logged_in") === "true") {
      window.location.href = "admin.html";
    }
  </script>
</body>
</html>
